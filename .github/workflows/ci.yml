name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Swift tests
        run: swift test
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Repository validation
        run: python3 scripts/check_scaffold.py && python3 scripts/check_repository.py

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          xcodebuild \
            -project MotifGrid.xcodeproj \
            -scheme MotifGrid \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Capture workspace screenshots
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = [
              item
              for runtime in devices.values()
              for item in runtime
              if item.get("isAvailable") and item["name"].startswith("iPhone")
          ]
          print(candidates[-1]["udid"])
          ')"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Debug-iphonesimulator/MotifGrid.app' -print -quit)"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          mkdir -p screenshots
          for WORKSPACE in MRT2 Collider Jam; do
            xcrun simctl launch --terminate-running-process "$DEVICE_ID" \
              com.topabaem.motifgrid --workspace "$WORKSPACE"
            sleep 2
            xcrun simctl io "$DEVICE_ID" screenshot "screenshots/$WORKSPACE.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
