name: MotifGrid
options:
  bundleIdPrefix: com.topabaem
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_LANGUAGE: en
    CODE_SIGN_STYLE: Automatic
targets:
  MotifGridCore:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/MotifGridCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.topabaem.motifgrid.core
        PRODUCT_NAME: MotifGridCore
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  MotifGrid:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/MotifGridApp
    resources:
      - path: Resources
      - path: THIRD_PARTY_NOTICES.md
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.topabaem.motifgrid
        PRODUCT_NAME: MotifGrid
        INFOPLIST_FILE: Config/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - target: MotifGridCore
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
      - sdk: CoreML.framework
      - sdk: OSLog.framework
  MotifGridTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/MotifGridCoreTests
    dependencies:
      - target: MotifGridCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.topabaem.motifgrid.tests
schemes:
  MotifGrid:
    build:
      targets:
        MotifGridCore: all
        MotifGrid: all
        MotifGridTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - MotifGridTests
